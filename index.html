<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чайная лавка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f0eb; padding: 16px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #4a3728; margin: 20px 0; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
            background: #eee;
        }
        .card h3 { margin: 12px 0 6px; color: #2d1f14; }
        .card .desc { color: #666; font-size: 14px; margin-bottom: 8px; }
        .card .price { font-size: 20px; font-weight: bold; color: #4a3728; }
        .card .stock { color: #888; font-size: 13px; margin: 4px 0 12px; }
        .btn-order {
            background: #4a3728;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-order:hover { background: #2d1f14; }
        .btn-order:disabled { background: #aaa; cursor: not-allowed; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
        }
        .modal-content h2 { margin-bottom: 16px; color: #4a3728; }
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .modal-content .btn-submit {
            background: #4a3728;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 30px;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
        }
        .modal-content .btn-submit:hover { background: #2d1f14; }
        .modal-content .btn-close {
            background: #eee;
            border: none;
            padding: 10px;
            border-radius: 30px;
            width: 100%;
            margin-top: 8px;
            cursor: pointer;
        }
        .loading { text-align: center; padding: 40px; color: #666; }
        .error { text-align: center; padding: 40px; color: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍵 Чайная лавка</h1>
        <div id="catalog">
            <div class="loading">Загрузка чая...</div>
        </div>
    </div>

    <!-- Модалка заказа -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <h2>Оформление заказа</h2>
            <p id="productName" style="color:#666;margin-bottom:12px;"></p>
            <input type="text" id="customerName" placeholder="Ваше имя" required>
            <input type="tel" id="customerPhone" placeholder="Телефон" required>
            <input type="text" id="customerAddress" placeholder="Адрес доставки (необязательно)">
            <button class="btn-submit" onclick="sendOrder()">Заказать</button>
            <button class="btn-close" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbxmnXYhWXUzR0GWbUG8qtJdOr0TNot7IhUQRtCjY4C23GM5A0Bp5mC5qMaZ6g5p2TxTng/exec/exec"; // ⚠️ ЗАМЕНИТЕ!

        let currentProduct = null;

        // Загрузка каталога
        async function loadCatalog() {
            try {
                const response = await fetch(SCRIPT_URL);
                const products = await response.json();
                renderCatalog(products);
            } catch(e) {
                document.getElementById('catalog').innerHTML = '<div class="error">❌ Не удалось загрузить каталог. Проверьте URL скрипта.</div>';
                console.error(e);
            }
        }

        function renderCatalog(products) {
            const container = document.getElementById('catalog');
            if (!products || products.length === 0) {
                container.innerHTML = '<div class="error">Каталог пуст. Добавьте товары в таблицу.</div>';
                return;
            }
            container.innerHTML = products.map(p => `
                <div class="card">
                    <img src="${p.photo || 'https://via.placeholder.com/300x200?text=Чай'}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300x200?text=Чай'">
                    <h3>${p.name}</h3>
                    <div class="desc">${p.desc || ''}</div>
                    <div class="price">${p.price} ₽</div>
                    <div class="stock">Остаток: ${p.stock || 0} шт.</div>
                    <button class="btn-order" onclick="openModal('${p.name}')" ${p.stock <= 0 ? 'disabled' : ''}>
                        ${p.stock <= 0 ? 'Нет в наличии' : 'Заказать'}
                    </button>
                </div>
            `).join('');
        }

        // Открыть модалку
        function openModal(productName) {
            currentProduct = productName;
            document.getElementById('productName').textContent = `Товар: ${productName}`;
            document.getElementById('customerName').value = '';
            document.getElementById('customerPhone').value = '';
            document.getElementById('customerAddress').value = '';
            document.getElementById('orderModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('orderModal').classList.remove('active');
            currentProduct = null;
        }

        // Отправить заказ
        async function sendOrder() {
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const address = document.getElementById('customerAddress').value.trim();

            if (!name || !phone) {
                alert('Пожалуйста, заполните имя и телефон');
                return;
            }

            const order = {
                product: currentProduct,
                name: name,
                phone: phone,
                address: address,
                quantity: 1
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(order)
                });
                alert('✅ Заказ отправлен! Мы свяжемся с вами.');
                closeModal();
            } catch(e) {
                alert('❌ Ошибка при отправке. Попробуйте ещё раз.');
                console.error(e);
            }
        }

        // Запуск
        loadCatalog();
    </script>
</body>
</html>
